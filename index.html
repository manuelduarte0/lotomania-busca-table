<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analisador Lotomania</title>
<style>
 body { background:#0A0A0A; color:white; font-family:Arial; text-align:center; padding:15px; }
 h1 { color:#FF8C00; }
 input { width:100px; padding:10px; font-size:16px; border-radius:8px; border:2px solid #FF8C00; background:#222; color:white; text-align:center; margin:3px; }
 button { padding:12px 18px; font-size:15px; background:#FF8C00; border:none; border-radius:10px; cursor:pointer; font-weight:bold; margin:5px; color:#000; }
 button.congelado { background:#00FF00!important; }

.tabela { display:grid; grid-template-columns: repeat(10, 1fr); gap:4px; max-width:500px; margin:20px auto; }
.numero { width:100%; aspect-ratio:1/1; border:1px solid #444; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:bold; background:#222; transition:0.3s; font-size:14px; position:relative; }
.numero span { font-size:10px; position:absolute; bottom:2px; right:3px; }
.numero.marca { font-size:16px; position:absolute; top:1px; right:2px; color:#FF0000; font-weight:bold; }

 /* CORES POR FREQUENCIA */
.freq1 { background:#FF8C00!important; color:#000; } /* 1x Laranja */
.freq2 { background:#00BFFF!important; color:#000; } /* 2x Azul */
.freq3 { background:#FF0000!important; color:#fff; } /* 3x Vermelho */
.freq4 { background:#DA70D6!important; color:#fff; } /* 4x Lilás */
.freq5 { background:#8B4513!important; color:#fff; } /* 5x Marrom */
.freq6 { background:#00FF00!important; color:#000; } /* 6x Verde */
.freq7 { background:#FFFF00!important; color:#000; } /* 7x+ Amarelo Claro */

 /* COR DE CONGELADO */
.frozen { opacity:0.7; border:2px solid #555!important; }

 #legenda { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; font-size:12px; margin:10px; }
.leg { padding:4px 8px; border-radius:5px; }
</style>
</head>
<body>

<h1>📊 Analisador Lotomania</h1>

De: <input type="number" id="de" placeholder="2931">
Até: <input type="number" id="ate" placeholder="2940">
<br>
<button onclick="buscarIntervalo()">🔍 PESQUISAR INTERVALO</button>
<button onclick="anterior()">⬅ ANTERIOR</button>
<button onclick="proximo()">PRÓXIMO ➡</button>
<button onclick="ultimo()">ULTIMO</button>
<button onclick="limpar()">LIMPAR</button>
<button id="btnCongelar" onclick="toggleCongelar()">🧊 CONGELAR</button> <!-- AQUI ESTA O BOTAO -->

<div id="info"></div>

<div id="legenda">
 <div class="leg freq1">1x Laranja</div>
 <div class="leg freq2">2x Azul</div>
 <div class="leg freq3">3x Vermelho</div>
 <div class="leg freq4">4x Lilás</div>
 <div class="leg freq5">5x Marrom</div>
 <div class="leg freq6">6x Verde</div>
 <div class="leg freq7">7x+ Amarelo</div>
</div>

<div class="tabela" id="tabela"></div>

<script>
const API = "https://loteriascaixa-api.herokuapp.com/api/lotomania/";
let contador = {};
let congelado = false;
let contadorCongelado = {};
let concursoAtualMarcado = [];

function criarTabela(){
  const tabela = document.getElementById('tabela');
  tabela.innerHTML = "";
  for(let i = 1; i <= 99; i++){
    let num = i.toString().padStart(2, '0');
    tabela.innerHTML += `<div class="numero" id="n${num}">${num}<span id="c${num}"></span><span class="marca" id="m${num}"></span></div>`;
  }
  tabela.innerHTML += `<div class="numero" id="n00">00<span id="c00"></span><span class="marca" id="m00"></span></div>`;
}

function toggleCongelar(){
  congelado =!congelado;
  let btn = document.getElementById('btnCongelar');
  if(congelado){
    contadorCongelado = {...contador};
    btn.innerText = "🔓 DESCONGELAR";
    btn.classList.add('congelado');
    document.querySelectorAll('.numero').forEach(el => el.classList.add('frozen'));
    document.getElementById('info').innerText += " | MODO CONGELADO";
  } else {
    contadorCongelado = {};
    concursoAtualMarcado = [];
    btn.innerText = "🧊 CONGELAR";
    btn.classList.remove('congelado');
    document.querySelectorAll('.numero').forEach(el => el.classList.remove('frozen'));
    limparMarcas();
    pintarTabela();
  }
}

function limparMarcas(){
  document.querySelectorAll('.marca').forEach(el => el.innerText = '');
}

async function buscarIntervalo(){
  let de = parseInt(document.getElementById('de').value);
  let ate = parseInt(document.getElementById('ate').value);
  if(!de ||!ate) return alert("Preencha De e Até");
  if(ate - de > 9) return alert("Máximo 10 concursos por vez");

  if(!congelado) limpar();

  document.getElementById('info').innerText = `Buscando ${de} até ${ate}...`;

  concursoAtualMarcado = [];

  for(let i = de; i <= ate; i++){
    try{
      let res = await fetch(API + i);
      let data = await res.json();
      if(!data.erro){
        data.dezenas.forEach(n => {
          contador[n] = (contador[n] || 0) + 1;
        });
        if(i == ate) concursoAtualMarcado = data.dezenas;
      }
    } catch(e){}
  }
  pintarTabela();
  marcarNovos();
  document.getElementById('info').innerText = `Analisados ${ate - de + 1} concursos`;
}

function pintarTabela(){
  let baseContador = congelado? {...contadorCongelado,...contador} : contador;

  for(let num in baseContador){
    let vezes = baseContador[num];
    let el = document.getElementById('n' + num);
    let contEl = document.getElementById('c' + num);
    if(el){
      el.className = 'numero';
      if(congelado) el.classList.add('frozen');
      let classe = vezes >= 7? 'freq7' : 'freq' + vezes;
      el.classList.add(classe);
      contEl.innerText = vezes;
    }
  }
}

function marcarNovos(){
  limparMarcas();
  concursoAtualMarcado.forEach(n => {
    let marcaEl = document.getElementById('m' + n);
    if(marcaEl) marcaEl.innerText = '×';
  });
}

function proximo(){
  let de = parseInt(document.getElementById('de').value);
  let ate = parseInt(document.getElementById('ate').value);
  if(!de ||!ate) return alert("Preencha De e Até primeiro");
  document.getElementById('de').value = de + 1;
  document.getElementById('ate').value = ate + 1;
  buscarIntervalo();
}

function anterior(){
  let de = parseInt(document.getElementById('de').value);
  let ate = parseInt(document.getElementById('ate').value);
  if(!de ||!ate) return alert("Preencha De e Até primeiro");
  if(de <= 1) return alert("Já está no primeiro concurso");
  document.getElementById('de').value = de - 1;
  document.getElementById('ate').value = ate - 1;
  buscarIntervalo();
}

async function ultimo(){
  limpar();
  document.getElementById('info').innerText = "Buscando último...";
  let res = await fetch(API + "latest");
  let data = await res.json();
  data.dezenas.forEach(n => contador[n] = 1);
  concursoAtualMarcado = data.dezenas;
  pintarTabela();
  marcarNovos();
  document.getElementById('info').innerHTML = `<h2>Concurso ${data.concurso}</h2>`;
}

function limpar(){
  contador = {};
  contadorCongelado = {};
  concursoAtualMarcado = [];
  document.querySelectorAll('.numero').forEach(el => {
    el.className = 'numero';
    el.querySelector('span').innerText = '';
  });
  limparMarcas();
  document.getElementById('info').innerText = '';
}

criarTabela();
</script>

</body>
</html>
